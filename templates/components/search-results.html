<div
  class="flex flex-col h-auto max-h-[300px] overflow-y-auto mt-4 overflow-scroll rounded-[5px] border border-[var(--border-color)] bg-[var(--sec-bg-color)]"
>
  <div class="border-b border-[var(--border-color)] px-[20px] py-[15px]">
    <p class="text-[20px] text-[var(--sec-text)]">Chats</p>
  </div>
  {% for chat in search_chats %} {% include 'components/search-item.html' %} {%
  endfor %}
</div>

{% if search_calls %}
<div
  class="flex flex-col h-auto max-h-[300px] overflow-y-auto mt-4 overflow-scroll rounded-[5px] border border-[var(--border-color)] bg-[var(--sec-bg-color)]"
>
  <div class="border-b border-[var(--border-color)] px-[20px] py-[15px]">
    <p class="text-[20px] text-[var(--sec-text)]">Calls</p>
  </div>
  <table class="w-full call-table">
    <tbody class="text-[var(--text-color)] text-[14px]">
      {% for call in search_calls %}
        {% include 'components/call-item.html' ignore missing %}
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
